[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndcb"
version = "1.0.0"
description = "Reference implementation of the NDCB compound-bias metric for generative language models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-4.0" }
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
    "tqdm>=4.66",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
dev = ["pytest>=7.4", "boto3>=1.34"]

[project.scripts]
ndcb = "ndcb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

